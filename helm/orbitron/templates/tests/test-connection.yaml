apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "orbitron.fullname" . }}-test-connection"
  labels:
    {{- include "orbitron.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=5"
        - "http://{{ include "orbitron.fullname" . }}:{{ .Values.service.port }}/healthz"
  restartPolicy: Never