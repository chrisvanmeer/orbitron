services:
  orbitron:
    # Pre-built image published to GHCR on every release tag; `docker compose
    # up -d --build` rebuilds it locally instead when you prefer that.
    image: ghcr.io/chrisvanmeer/orbitron:latest
    build:
      context: .
      args:
        VERSION: dev
    container_name: orbitron
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Listen inside the container; the published host port maps onto it.
      - ORBITRON_LISTEN_ADDR=0.0.0.0:8080
      - ORBITRON_STORAGE_PATH=/data
      - ORBITRON_LOG_PATH=
      - ORBITRON_TOKENS_FILE=/data/tokens.json
      - ORBITRON_REQUIRE_AUTH_PULL=false
      - ORBITRON_MAX_CONCURRENCY=4
      - ORBITRON_TOKEN_TTL_DAYS=0
      - ORBITRON_AUTO_TOKEN=true
      # Optional forward proxy for outbound Galaxy API calls, collection
      # downloads and git clones (e.g. a Squid proxy).
      # - ORBITRON_HTTP_PROXY=http://proxy.internal:3128
      # - ORBITRON_HTTPS_PROXY=http://proxy.internal:3128
      # - ORBITRON_NO_PROXY=localhost,127.0.0.1,10.0.0.0/8
      # Optional SSO (OIDC / Keycloak) authentication for the web dashboard.
      # When enabled, the /ui login page additionally offers "Sign in with SSO"
      # next to the regular access-token login.
      # - ORBITRON_OIDC_ENABLED=true
      # - ORBITRON_OIDC_ISSUER=https://keycloak.example.org/realms/orbitron
      # - ORBITRON_OIDC_CLIENT_ID=orbitron
      # - ORBITRON_OIDC_CLIENT_SECRET=<client secret from Keycloak>
      # - ORBITRON_OIDC_SESSION_TTL_HOURS=8
      # Leave empty to auto-derive the redirect URI from the request as
      # <scheme>://<host>/ui/oidc/callback; must match a Keycloak-registered
      # redirect URI when set explicitly.
      # - ORBITRON_OIDC_REDIRECT_URI=
      # Optionally restrict SSO login to members of at least one of these
      # groups (comma-separated; requires the "groups" claim in the ID token,
      # see README). Leave empty to admit every verified SSO user.
      # - ORBITRON_OIDC_ALLOWED_GROUPS=orbitron-admins,orbitron-ops
      # Timezone used for container log timestamps.
      - TZ=Europe/Amsterdam
    volumes:
      # Persistent cache: roles, collections and the admin token survive
      # container rebuilds.
      - orbitron-data:/data

volumes:
  orbitron-data:
    name: orbitron-data
