---
releases:
  1.0.0:
    changes:
      release_summary: |
        Initial release of the `chrisvanmeer.orbitron` collection.

        Provides six HTTP modules (`orbitron_info`, `orbitron_token`,
        `orbitron_manifest`, `orbitron_sync`, `orbitron_purge`,
        `orbitron_prune`) and two roles (`orbitron`, `orbitron_mirror`) to
        install, configure, and operate the Orbitron Galaxy mirror daemon.
    release_date: '2026-09-18'
  1.2.0:
    changes:
      release_summary: |
        First version published to Ansible Galaxy.

        Adds the GPL-3.0-or-later license files (`COPYING`,
        `LICENSES/GPL-3.0-or-later.txt`), a Galaxy auto-publish workflow, and
        an end-to-end ansible-lint cleanup of the roles (handler naming,
        `changed_when` policies, and mirror role variable prefixes), plus the
        missing changelog metadata.
    release_date: '2026-09-18'
  1.2.1:
    changes:
      release_summary: |
        Fix the Galaxy import by adding the role metadata and readme files the
        Ansible Galaxy importer requires for the `orbitron` and
        `orbitron_mirror` roles.
      bugfixes:
        - >-
          Add ``meta/main.yml`` and ``README.md`` to both roles so the Galaxy
          import validation no longer fails on missing role metadata and
          missing role readmes.
    release_date: '2026-09-18'
