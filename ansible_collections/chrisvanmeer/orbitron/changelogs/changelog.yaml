---
releases:
  1.7.0:
    changes:
      release_summary: |
        Orbitron 1.7.0 adds an optional TLS policy for outbound HTTPS. When
        the daemon talks to services signed by a private or self-signed CA (an
        internal Galaxy mirror, a self-hosted git server, or Keycloak behind a
        corporate PKI), the new ``tls`` config block lets it trust a custom CA
        bundle (``tls.ca_file``) or bluntly skip verification
        (``tls.insecure_skip_tls_verify``). The policy is applied uniformly to
        Galaxy API calls, collection downloads, git HTTPS remotes and OIDC
        discovery/token/JWKS fetching. The ``orbitron`` role renders the block
        from the ``orbitron_tls_ca_file`` / ``orbitron_tls_ca_path`` /
        ``orbitron_tls_insecure_skip_tls_verify`` variables (deploying the CA
        bundle to the daemon host), and the container plumbing exposes the
        ``ORBITRON_TLS_CA_FILE`` and ``ORBITRON_TLS_INSECURE_SKIP_TLS_VERIFY``
        environment variables.
      minor_features:
        - >-
          The daemon config gains an optional ``tls`` block
          (``ca_file``, ``insecure_skip_tls_verify``). ``tls.ca_file`` points
          at a PEM bundle trusted in addition to the system roots for outbound
          HTTPS; ``tls.insecure_skip_tls_verify`` disables outbound TLS
          verification entirely, the blunt equivalent of ``curl -k``. The
          policy covers Galaxy API calls, collection downloads, git HTTPS
          remotes (via ``GIT_SSL_CAINFO`` / ``GIT_SSL_NO_VERIFY``) and OIDC
          discovery/token/JWKS fetching. A missing or invalid CA file is
          rejected at daemon start.
        - >-
          The ``orbitron`` role gains ``orbitron_tls_ca_file`` to deploy a
          local PEM CA bundle to ``orbitron_tls_ca_path`` on the daemon host,
          rendered into the ``tls.ca_file`` config key, plus
          ``orbitron_tls_insecure_skip_tls_verify`` for the matching flag.
  1.6.0:
    changes:
      release_summary: |
        Orbitron 1.6.0 adds optional SSO authentication to the web dashboard.
        The daemon can now authenticate dashboard users against an external
        OpenID Connect identity provider such as Keycloak, in addition to the
        regular administrative Bearer token. It is purely an authentication
        gate: a successful SSO login opens the dashboard exactly like a valid
        token would, and the UI remains read-only. Access can optionally be
        restricted to members of specific Keycloak groups via the
        ``oidc.allowed_groups`` filter. The ``orbitron`` Ansible
        role renders the new ``oidc`` config block from the ``orbitron_oidc_*``
        variables, and the Docker Compose and Nomad files document the matching
        ``ORBITRON_OIDC_*`` environment variables.
      minor_features:
        - >-
          The web dashboard /ui login page gains a ``SSO Login`` button next
          to the regular access-token login whenever OIDC is enabled. The
          token button is then relabelled ``Authenticate with Token``.
        - >-
          The daemon config gains an optional ``oidc`` block (``enabled``,
          ``issuer``, ``client_id``, ``client_secret``, ``session_ttl_hours``,
          ``redirect_uri``). The authorization-code flow uses PKCE (S256) and a
          confidential client secret; the ID token is verified against the
          issuer's JWKS (RS256/ES256) by checking issuer, audience, expiry and
          a per-login nonce, with JWKS key rotation handled by re-fetching on
          unknown key IDs.
        - >-
          The optional ``oidc.allowed_groups`` access filter admits only users
          who are a member of at least one listed Keycloak group (matched
          against the ID token ``groups`` claim), denying everyone else and
          failing closed when the claim is absent. An empty list disables the
          filter. The ``orbitron`` role gains the matching
          ``orbitron_oidc_allowed_groups`` variable and the container plumbing
          the ``ORBITRON_OIDC_ALLOWED_GROUPS`` environment variable.
        - >-
          SSO dashboard sessions live in memory only: they never touch
          ``tokens.json``, reset on daemon restart, expire after the configured
          ``session_ttl_hours`` (default 8), and are revoked by the DISCONNECT
          button. The SSO session cookie satisfies API authentication the same
          way the token cookie does.
        - >-
          ``redirect_uri`` can be left empty to be auto-derived from the
          incoming request as ``<scheme>://<host>/ui/oidc/callback`` (honoring
          TLS and ``X-Forwarded-Proto``), which must match a registered
          redirect URI in the identity provider client.
        - >-
          The ``orbitron`` role gains the new ``orbitron_oidc_enabled``,
          ``orbitron_oidc_issuer``, ``orbitron_oidc_client_id``,
          ``orbitron_oidc_client_secret``, ``orbitron_oidc_session_ttl_hours``
          and ``orbitron_oidc_redirect_uri`` variables, rendering the ``oidc``
          config block only when enabled.
        - >-
          The importable Grafana dashboard renders the storage and cached
          version series as proper range queries and hides zero-value samples
          from the capacity and growth panels; the dashboard login page got a
          refreshed logo asset.
        - >-
          The daemon now reloads its configuration hot: ``systemctl reload
          orbitron`` (or ``SIGHUP``) re-reads ``config.yml``, re-validates it
          (including OIDC discovery when enabled), reopens the log file after a
          logrotate rotation and rebuilds the HTTP server on the same address.
          A failing configuration leaves the running daemon untouched and is
          logged; the installer-generated systemd unit gained an
          ``ExecReload=/bin/kill -HUP $MAINPID`` directive.
      bugfixes:
        - >-
          ID tokens whose ``aud`` claim is a single JSON string (Keycloak's
          format while a token has exactly one audience) no longer fail
          verification with "cannot unmarshal string into Go struct field
          Claims.aud"; the claim is now accepted as either a string or an
          array.
        - >-
          A failing well-known OpenID discovery against a 404/403 (typically a
          Keycloak issuer configured without the ``/realms/<realm>`` path
          segment) now reports that hint in the error instead of a bare
          "unexpected status".
        - >-
          The ``oidc.allowed_groups`` access filter now also matches Keycloak
          "Group Membership" claims emitted as full group paths (e.g.
          ``/admins`` or ``/orbitron/admins``): a claim matches when it equals
          the allowed name, differs only by a leading slash, or shares the
          same last path segment. Denied logins now log the user's actual
          ``groups`` claim to simplify troubleshooting.
  1.5.2:
    changes:
      release_summary: |
        Orbitron 1.5.2 mirrors Galaxy roles under their real git tags and
        warms the Docker build cache. Roles whose upstream repo tags releases
        with a ``v`` prefix (the Galaxy default) no longer fail to clone, and
        mirrored role versions always match the tags Galaxy advertises.
      bugfixes:
        - >-
          Galaxy role sync no longer treats a role's sanitized ``version``
          field as a literal git branch. Published versions are resolved to
          the exact upstream tag first (via ``git ls-remote --tags``, probing
          both the bare version and its ``v``-prefixed spelling) and cloned
          and checked out from that tag, so roles tagged ``v1.0.1`` mirror
          successfully instead of failing with "Remote branch 1.0.1 not found
          in upstream origin".
        - >-
          An explicitly pinned role version is canonicalized to the real tag,
          so the same version is never stored and served under two spellings
          (which broke ``ansible-galaxy``'s latest-version comparison). In
          ``all`` mode, versions whose tag no longer exists are skipped with a
          warning instead of aborting the entire role.
        - >-
          The Docker image build warms the Go build cache so multi-stage
          rebuilds of the container skip recompiling the whole module graph.
    release_date: '2026-09-20'
  1.5.1:
    changes:
      release_summary: |
        Orbitron 1.5.1 quiets the Prometheus scrape traffic in the daemon log,
        ships an importable Grafana dashboard for the metrics, and makes the
        SYSTEM LOGS panel work under Nomad by persisting the log file on the
        host volume.
      minor_features:
        - >-
          ``HTTP GET /metrics`` scrape requests are no longer logged at INFO
          level (like ``/healthz`` and ``/ui``), keeping the daemon log
          readable for Prometheus setups that poll the endpoint every
          interval.
        - >-
          The repository ships an importable Grafana dashboard for the
          Prometheus metrics; its table frames are de-duplicated and the
          "Largest cached items" gauge widened. When file logging is disabled,
          the SYSTEM LOGS panel now shows a hint that the log was emitted to
          stdout instead of an empty drawer.
        - >-
          The Nomad jobspec persists ``orbitron.log`` on the ``orbitron-data``
          host volume so the SYSTEM LOGS panel functions under Nomad too,
          instead of tying logs to an ephemeral alloc directory.
    release_date: '2026-09-20'
  1.5.0:
    changes:
      release_summary: |
        Orbitron 1.5.0 reworks the Prometheus ``/metrics`` endpoint around a
        shared inventory scanner and ships the Docker and Nomad deployment
        files. The metric set now matches the dashboard counts and on-disk
        sizes, and the repository gains a Dockerfile, docker-compose.yml and a
        validated Nomad jobspec for running the daemon as a containerized
        service.
      features:
        - >-
          ``/metrics`` is rebuilt on a shared inventory scanner: the outdated
          ``orbitron_manifests_total`` gauge is replaced by aggregate gauges
          for role, collection, version and namespace counts plus total
          storage bytes, and per-item labeled series
          (``orbitron_cached_item_bytes``, ``orbitron_cached_version_bytes``)
          using block-allocated bytes to match the dashboard and prune logic.
        - >-
          The repository now ships Docker, Docker Compose and Nomad deployment
          files (GHCR container image, compose with a persistent volume, and a
          Nomad jobspec with a host volume and health check); the container
          health check derives its port from ``ORBITRON_LISTEN_ADDR`` instead
          of hardcoding 8080.
    release_date: '2026-09-20'
  1.4.1:
    changes:
      release_summary: |
        Orbitron 1.4.1 makes multi-version caching easier to scan and gives
        the ``orbitron`` Ansible role optional access-based storage pruning.

        Roles and collections with multiple cached versions now collapse into
        a single, sortable row in the web dashboard that unfolds on click to
        reveal every version with its own LAST ACCESS date, and the sortable
        column headers are clearly signposted. On the automation side, the
        ``orbitron`` role can prune versions that have not been served within
        a retention window after installation, running a dry-run preview first
        by default.
      minor_features:
        - >-
          The web dashboard cache matrix collapses roles and collections with
          more than one cached version into a single row showing the version
          count, the most recent access, and the total disk usage; an expand
          caret unfolds all versions with their individual LAST ACCESS dates.
          Expanded groups survive the automatic refresh.
        - >-
          Sortable column headers are now signposted: every sortable header
          shows a persistent up-down arrow indicator, highlights the active
          sort column with an up or down triangle, and a hint below the search
          box announces that column headers are clickable for sorting.
        - >-
          The ``orbitron`` role can now prune unserved cached versions after
          install via ``orbitron_prune_days`` (retention window in days; the
          default ``0`` disables pruning). Pruning runs as a dry run by
          default; set ``orbitron_prune_dry_run: false`` to delete candidates
          for real.
    release_date: '2026-09-20'
  1.4.0:
    changes:
      release_summary: |
        Configurable forward proxy support. Orbitron now honours
        ``http_proxy``, ``https_proxy`` and ``no_proxy`` keys in
        ``config.yml`` so the daemon can synchronize Ansible content through a
        forward proxy such as Squid. The settings cover outbound Galaxy API
        calls, collection tarball downloads AND git clones/fetches, so git
        backed roles mirror over the same proxy. When the keys are left empty
        Orbitron falls back to the process ``HTTP_PROXY``/``HTTPS_PROXY``/
        ``NO_PROXY`` environment variables, preserving the previous behaviour.
      features:
        - >-
          The daemon config gains three optional keys: ``http_proxy`` (for
          ``http://`` requests), ``https_proxy`` (for ``https://`` requests,
          falling back to ``http_proxy`` when unset and vice versa), and
          ``no_proxy``, a comma-separated list of exclusions supporting exact
          hostnames, ``.domain``/``*.domain`` suffixes, a bare ``*``, and CIDR
          ranges (e.g. ``10.0.0.0/8``).
        - >-
          Git-backed roles and collections clone and fetch through the
          configured proxy: the ``http_proxy``/``https_proxy``/``no_proxy``
          environment (upper- and lowercase) is exported to every ``git``
          subprocess the fetcher spawns.
        - >-
          The ``chrisvanmeer.orbitron`` role renders the new keys into
          ``/etc/orbitron/config.yml`` via ``orbitron_http_proxy``,
          ``orbitron_https_proxy`` and ``orbitron_no_proxy`` (default empty,
          meaning environment fallback), documented with examples in the role,
          collection, and playbook documentation.
    release_date: '2026-09-20'
  1.3.2:
    changes:
      release_summary: |
        Orbitron 1.3.2 fixes the sync-status backoff that crashed the
        orbitron_sync module released in 1.3.1.
      bugfixes:
        - >-
          The ``orbitron_sync`` module now sleeps with ``time.sleep()`` between
          sync-status polls. The 1.3.1 rewrite used a non-existent
          ``AnsibleModule.sleep`` method, so any run that had to wait for a
          running or still-in-flight mirror job failed with
          ``'AnsibleModule' object has no attribute 'sleep'`` and the play
          aborted on the "Sync the mirror" task.
    release_date: '2026-09-20'
  1.3.1:
    changes:
      release_summary: |
        Idempotent syncs and a quieter mirror daemon.
      bugfixes:
        - >-
          The ``orbitron_sync`` module polls the daemon's ``/api/v1/sync/status``
          endpoint with exponential backoff (1 s, then doubling up to a 10 s cap,
          all bounded by the module timeout) while waiting for a running mirror job,
          instead of hammering the endpoint once per second. Long syncs no longer
          flood the daemon access log with one status request per second.
        - >-
          Re-running ``orbitron_sync`` over content that is already fully mirrored
          no longer reports ``changed``. The module now snapshots the mirrored
          inventory before triggering a job and compares a canonical, order
          independent fingerprint of every stored (role/collection, version) pair
          against the storage after the job settles. A rerun that mirrored nothing
          new reports ``ok`` (``changed=false``, ``state=completed``) instead of
          advertising a change every single time, so a playbook that consistently
          calls the module stops falsely marking the run as changed on every poll
          loop. Forced runs (``force: true``) and runs observed to actually mirror
          new content still report ``changed=true``.
    release_date: '2026-09-20'
  1.3.0:
    changes:
      release_summary: |
        Orbitron 1.3.0 replaces the manifest-derived prune logic with real
        access-based retention and reworks the dashboard into a live storage
        matrix.

        Every role and collection version now records the exact moment it was
        last served to a client. The dashboard exposes it as a sortable,
        searchable LAST ACCESS column, and the daemon prunes versions that have
        not been served within a configurable window (``days``, default 90).
        Versions that were never requested are always kept, so freshly mirrored
        content is never removed before it can be used. The prune HTTP endpoint
        is now live (no longer a 501 placeholder) and accepts a
        ``{"dry_run": true, "days": N}`` preview payload; the ``orbitron_prune``
        module and ``--prune --days N`` CLI flag wrap the same contract.
      minor_features:
        - >-
          The pruner is now access-based: instead of inferring activity from
          stale manifests, Orbitron records the last time each cached version
          was actually served and only prunes versions whose last access falls
          outside the ``days`` retention window. Never-requested versions are
          always kept, so freshly mirrored objects are protected from immediate
          pruning.
        - >-
          Access timestamps persist to ``<storage>/.access.json`` and are shared
          by the dashboard, the prune API, and the CLI pruner, so a dry run and
          a real prune always agree on what is stale.
        - >-
          The prune API is live: ``POST /api/v1/prune`` accepts
          ``{"days": N, "dry_run": true}`` to preview candidates without
          deleting (response ``executed: false``), and ``{"dry_run": false}``
          to delete for real. A dropped or omitted ``days`` uses the 90-day
          default; values shorter than one day are clamped up.
        - >-
          ``orbitron_prune`` and the ``--prune --days N`` CLI flag now perform
          real retention pruning. The module exposes ``days`` and ``dry_run``
          (default ``true``) and reports the pruned ``items``, ``freed_bytes``,
          and whether the delete ``executed``.
        - >-
          The storage dashboard is a live, sortable matrix: click the TYPE /
          NAME / VERSION / LAST ACCESS / DISK USAGE headers to sort, narrow
          rows with the always-on SEARCH filter, and hover a Last Access cell
          for the full ISO 8601 timestamp. Sort order and search text survive
          the automatic 10-second refresh.
        - >-
          The dashboard LOG STREAM is a tail-f drawer pinned to the newest
          lines; the pin is released only when you scroll up to read history.
          The System Metrics drawer now reports OS distribution, architecture,
          and last boot time, and the login screen gained an Orbitron logo and
          a hidden easter egg for the curious.
      bugfixes:
        - >-
          The dashboard no longer infers "active" versions by re-parsing stored
          manifests; the matrix instead shows a LAST ACCESS column based on the
          real access index, so it reflects what clients actually pulled rather
          than what a manifest once declared.
        - >-
          Re-running the mirror role after reverting to an already-mirrored
          version is idempotent (reports ``ok``) again: the sync decision now
          compares the declared manifest against what the mirror actually holds
          instead of forcing a pointless re-download.
  1.0.0:
    changes:
      release_summary: |
        Initial release of the `chrisvanmeer.orbitron` collection.

        Provides six HTTP modules (`orbitron_info`, `orbitron_token`,
        `orbitron_manifest`, `orbitron_sync`, `orbitron_purge`,
        `orbitron_prune`) and two roles (`orbitron`, `orbitron_mirror`) to
        install, configure, and operate the Orbitron Galaxy mirror daemon.
    release_date: '2026-09-18'
  1.2.0:
    changes:
      release_summary: |
        First version published to Ansible Galaxy.

        Adds the GPL-3.0-or-later license files (`COPYING`,
        `LICENSES/GPL-3.0-or-later.txt`), a Galaxy auto-publish workflow, and
        an end-to-end ansible-lint cleanup of the roles (handler naming,
        `changed_when` policies, and mirror role variable prefixes), plus the
        missing changelog metadata.
    release_date: '2026-09-18'
  1.2.1:
    changes:
      release_summary: |
        Fix the Galaxy import by adding the role metadata and readme files the
        Ansible Galaxy importer requires for the `orbitron` and
        `orbitron_mirror` roles.
      bugfixes:
        - >-
          Add ``meta/main.yml`` and ``README.md`` to both roles so the Galaxy
          import validation no longer fails on missing role metadata and
          missing role readmes.
    release_date: '2026-09-18'
  1.2.2:
    changes:
      release_summary: |
        Harden binary (re)installation. The ``orbitron --install`` self-copy
        now replaces the target atomically (temporary file plus rename) so it
        no longer fails with "text file busy" against an in-use binary. The
        ``orbitron`` role stages the binary in ``orbitron_stage_dir`` before
        bootstrapping and removes the staging directory afterwards, stops the
        daemon only when the binary actually changes, and renames its tasks so
        they describe the desired end state.
      bugfixes:
        - >-
          ``orbitron --install`` copies the binary to a throwaway file and
          renames it over the destination instead of truncating it in place,
          which failed on Linux with ETXTBSY when the destination was
          currently executing.
        - >-
          The ``orbitron`` role no longer runs ``orbitron --install`` from the
          final binary path. The binary is staged under ``orbitron_stage_dir``
          (must be on an ``exec``-capable mount), the service is stopped only
          when the binary must be replaced, and the staging directory is
          removed even when the bootstrap fails.
        - >-
          Role task names now describe the desired end state
          (``Ensure ...``) instead of the performed action.
    release_date: '2026-09-18'
  1.2.3:
    changes:
      release_summary: |
        Fix the orbitron_mirror role so it can actually run. Its opening
        ``set_fact`` computed the "has requirements" flag from sibling facts
        that are set in the same task; because Ansible templates a task's
        arguments before applying any of its facts, the expression failed at
        runtime with ``'_orbitron_mirror_has_roles' is undefined``. The flag
        is now derived directly from the four configured manifest sources.
      bugfixes:
        - >-
          The orbitron_mirror role no longer references facts set in the same
          ``set_fact`` task when deriving the "has requirements" flag, so the
          role stops failing with ``'... is undefined'`` before its first run
          completes.
    release_date: '2026-09-18'
  1.2.4:
    changes:
      release_summary: |
        Make the orbitron_mirror manifest flags real booleans. While the
        1.2.3 fix removed the sibling-``set_fact`` reference, the "or"
        expressions still yielded the first truthy source value itself (a list
        or string), and recent ansible-core rejects non-boolean values in
        ``assert``/``when`` conditionals with "Conditionals must have a
        boolean result". The flags are now derived with the ``truthy`` test so
        the role runs to completion.
      bugfixes:
        - >-
          The orbitron_mirror role's ``_orbitron_mirror_has_*`` facts are now
          actual booleans via the ``truthy`` test, so the configuration
          validation no longer fails with "Conditionals must have a boolean
          result" when a manifest source is configured.
    release_date: '2026-09-18'
  1.2.7:
    changes:
      release_summary: |
        Support mirroring every published version of a role or collection and
        stop re-downloading content the mirror already holds. A requirements
        version of ``all`` now fetches every published Galaxy version of that
        role (as git tags) or collection (as tarballs) instead of a single
        pinned or resolved release. Syncs no longer re-download versions that
        are already on disk, whether triggered by a manifest ingest or by an
        explicit sync: a corrupt or stale version is repaired by deleting it
        first (purge/DELETE) and letting the next sync fetch it fresh. Like
        ``latest`` and specifier versions, ``all`` is never fully satisfied,
        so every sync re-checks the published indexes for new releases while
        existing artifacts stay untouched.
      features:
        - >-
          Declare ``version: all`` (case-insensitive, reserved keyword) for
          Galaxy roles and collections to mirror every published version on
          every sync; git-sourced items reject it with a clear error since a
          git ``src`` has no published version index.
        - >-
          The daemon no longer re-downloads cached content: Galaxy collection
          artifacts that already exist are skipped and git versions whose
          directory already exists are skipped, so syncs only fetch what is
          missing or new. Delete a corrupt version to have the next sync
          fetch it again.
    release_date: '2026-09-18'
  1.2.6:
    changes:
      release_summary: |
        Fix the 1.2.5 sync regression and polish the daemon dashboard. The
        mirror role only synced when its manifest submission reported
        ``changed`` in that run, and the sync module would suppress the job
        again when the daemon had already picked the new manifest up, so a
        changed playbook could report ``ok`` and never mirror anything. The
        ``orbitron_sync`` module is now a real decision layer: every run it
        compares the declared requirements with what the mirror already holds
        and triggers a sync when a requirement is not mirrored at its exact
        version (empty, ``latest``, and expression-style versions always
        warrant a re-check), when ``force`` is set, or when a manifest just
        started a background sync. Repeat runs of a fully mirrored playbook
        are still idempotent and report ``ok``. The web dashboard now shows
        the Orbitron version in System Metrics and the DISCONNECT button
        requires a deliberate two-step confirmation so it can no longer be
        triggered by accident.
      bugfixes:
        - >-
          ``orbitron_sync`` compares ``GET /api/v1/manifests`` with
          ``GET /api/v1/storage`` before triggering and only reports a change
          when work is actually needed: a declared version that is not
          mirrored at its exact version, ``force``, or a sync the manifest
          submission already started. Unchanged, fully mirrored playbooks
          report ``ok`` and queue nothing.
        - >-
          The orbitron_mirror role always runs its sync task again (it is the
          module that decides), so uploading a changed manifest can never be
          masked by a background sync that started between the manifest
          submission and the sync task.
        - >-
          The web dashboard DISCONNECT button now arms on the first click and
          only logs out on a second click within five seconds, preventing
          accidental logouts; System Metrics gained an Orbitron Version row.
    release_date: '2026-09-18'
  1.2.5:
    changes:
      release_summary: |
        Make the orbitron_mirror role truly idempotent and quiet down the
        liveness probe in the daemon log. The mirror role used to trigger a
        full ``orbitron_sync`` on every run and always reported ``changed``;
        it now only syncs when a stored manifest actually changed in that run
        (set ``orbitron_mirror_sync_force`` to override). The daemon no longer
        logs routine ``/healthz`` probes alongside the already-suppressed
        ``/ui`` and favicon requests.
      bugfixes:
        - >-
          Re-running an unchanged orbitron_mirror playbook now reports no
          changes: the sync task only runs when a manifest changed, keeping
          the role idempotent while ``orbitron_mirror_sync_force: false``.
        - >-
          The Orbitron daemon stops logging ``HTTP GET /healthz`` probe
          requests at INFO level, keeping the log readable for orchestrators
          and uptime monitors that poll the liveness endpoint.
    release_date: '2026-09-18'
