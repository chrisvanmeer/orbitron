---
# --- Installation -----------------------------------------------------------
# Which orbitron release to install: "latest", or an exact tag such as v1.3.2.
orbitron_version: latest

# Local path to a pre-downloaded orbitron binary (air-gapped installs). Takes
# precedence over orbitron_version when set.
orbitron_binary_src: ""

# SHA-256 checksum of the binary for get_url verification.
orbitron_checksum: ""

# Directory that temporarily stages the binary before `orbitron --install` runs
# and that is removed afterwards. The staged binary is executed, so this path
# MUST be on a mount that allows execution; override it when /var (or /var/tmp)
# is mounted with `noexec`, e.g. orbitron_stage_dir: /opt/orbitron/stage.
orbitron_stage_dir: /var/tmp/orbitron-ansible

# Install git so git-backed roles/collections can be mirrored.
orbitron_install_git: true

# --- Daemon configuration (config.yml keys) -------------------------------

# Address the daemon binds and exposes its API on.
orbitron_listen_addr: 127.0.0.1:8080
orbitron_storage_path: /var/lib/orbitron/storage
orbitron_log_path: /var/log/orbitron/orbitron.log
orbitron_tokens_file: /etc/orbitron/tokens.json

# Require a token for pulling/downloading cached content.
orbitron_require_auth_pull: false

# Maximum number of concurrent download/clone workers during syncs.
orbitron_max_concurrency: 4

# Default lifetime of newly generated admin tokens in days (0 = never expire).
orbitron_token_ttl_days: 0

# Optional forward proxy for outbound Galaxy / git synchronization (e.g. Squid).
# Leave empty to use the daemon process environment HTTP(S)_PROXY/NO_PROXY.
orbitron_http_proxy: ""
orbitron_https_proxy: ""
orbitron_no_proxy: ""

# --- SSO (OIDC / Keycloak) authentication for the web dashboard -----------
# When enabled, the /ui login page additionally offers "Sign in with SSO" next
# to the regular access-token login. The issuer must be the full Keycloak realm
# URL, e.g. https://keycloak.example.org/realms/orbitron, and the client must
# be registered in Keycloak as a confidential OpenID Connect client with its
# redirect URI set to <scheme>://<host>/ui/oidc/callback.
orbitron_oidc_enabled: false
orbitron_oidc_issuer: ""
orbitron_oidc_client_id: ""
orbitron_oidc_client_secret: ""

# How long an authenticated dashboard session lives before the user has to
# log in again. Sessions are in-memory only and reset on daemon restart.
orbitron_oidc_session_ttl_hours: 8

# Optional canonical redirect URI advertised to the IDP. Leave empty to
# auto-derive it from the request as <scheme>://<host>/ui/oidc/callback.
orbitron_oidc_redirect_uri: ""

# Optional access filter: only users who are a member of at least one of these
# groups may log in (compared against the ID token "groups" claim, which
# Keycloak only emits after a "groups" client scope / Group Membership mapper
# with "Add to ID token: ON" is added to the client). Empty disables the filter.
orbitron_oidc_allowed_groups: []

# --- Service layout --------------------------------------------------------
orbitron_config_file: /etc/orbitron/config.yml

# --- Lifecycle -------------------------------------------------------------
# present installs and configures the daemon; absent uninstalls it.
orbitron_state: present

# --- Token bootstrap -------------------------------------------------------
# Initial administrative token. Leave "" to have the role generate one through
# the orbitron CLI and persist it to orbitron_token_path (mode 0600).
orbitron_token: ""
orbitron_token_path: /root/.orbitron_token

# --- Storage pruning -------------------------------------------------------
# Access-based retention window in days. Set to a value > 0 to run an
# orbitron_prune against the daemon after it is installed, removing cached
# role/collection versions that have not been served to a client within the
# window. 0 (the default) disables pruning in this role.
orbitron_prune_days: 0

# When true (the default), pruning only previews the candidate versions and
# never deletes anything. Set to false to actually remove the stale versions.
orbitron_prune_dry_run: true
