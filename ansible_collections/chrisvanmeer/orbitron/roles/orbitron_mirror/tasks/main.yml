---
- name: Determine which manifest sources are configured
  ansible.builtin.set_fact:
    _orbitron_mirror_has_roles: >-
      {{ (orbitron_mirror_roles or orbitron_mirror_role_manifest_path) is truthy }}
    _orbitron_mirror_has_collections: >-
      {{ (orbitron_mirror_collections or orbitron_mirror_collection_manifest_path) is truthy }}
    _orbitron_mirror_has_requirements: >-
      {{ (orbitron_mirror_roles or orbitron_mirror_role_manifest_path
          or orbitron_mirror_collections or orbitron_mirror_collection_manifest_path) is truthy }}

- name: Validate the mirror configuration
  ansible.builtin.assert:
    that:
      - orbitron_mirror_token != ""
      - _orbitron_mirror_has_requirements
    quiet: true
    fail_msg: >-
      Configure orbitron_mirror_roles, orbitron_mirror_collections, or a
      requirements file path, and set orbitron_mirror_token.

- name: Ensure the roles manifest is stored
  chrisvanmeer.orbitron.orbitron_manifest:
    url: "{{ orbitron_mirror_url }}"
    token: "{{ orbitron_mirror_token }}"
    type: roles
    roles: "{{ orbitron_mirror_roles | default(omit) }}"
    path: "{{ orbitron_mirror_role_manifest_path | default('') }}"
  when: _orbitron_mirror_has_roles

- name: Ensure the collections manifest is stored
  chrisvanmeer.orbitron.orbitron_manifest:
    url: "{{ orbitron_mirror_url }}"
    token: "{{ orbitron_mirror_token }}"
    type: collections
    collections: "{{ orbitron_mirror_collections | default(omit) }}"
    path: "{{ orbitron_mirror_collection_manifest_path | default('') }}"
  when: _orbitron_mirror_has_collections

- name: Sync the mirror
  chrisvanmeer.orbitron.orbitron_sync:
    url: "{{ orbitron_mirror_url }}"
    token: "{{ orbitron_mirror_token }}"
    force: "{{ orbitron_mirror_sync_force }}"
    wait: "{{ orbitron_mirror_wait_sync }}"
  when: _orbitron_mirror_has_requirements
