name: orbitron
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Chris van Meer
vendor: Orbitron
homepage: https://github.com/chrisvanmeer/orbitron
license: GPL-3.0-or-later
description: >-
  A lightweight Ansible Galaxy and Git-based role/collection mirror daemon.
  The package installs and manages the Orbitron systemd service.
depends:
  - git
  - systemd
recommends:
  - logrotate
contents:
  - src: ${BINARY}
    dst: /usr/bin/orbitron
    expand: true
    file_info:
      mode: 0755
  - src: packaging/orbitron.service
    dst: /usr/lib/systemd/system/orbitron.service
    file_info:
      mode: 0644
  - src: packaging/default-config.yml
    dst: /etc/orbitron/config.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: orbitron
  - src: packaging/logrotate
    dst: /etc/logrotate.d/orbitron
    file_info:
      mode: 0644
  - dst: /etc/orbitron
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: orbitron
  - dst: /var/lib/orbitron
    type: dir
    file_info:
      mode: 0750
      owner: orbitron
      group: orbitron
  - dst: /var/lib/orbitron/storage
    type: dir
    file_info:
      mode: 0750
      owner: orbitron
      group: orbitron
  - dst: /var/log/orbitron
    type: dir
    file_info:
      mode: 0750
      owner: orbitron
      group: orbitron
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
overrides:
  deb:
    scripts:
      preremove: packaging/deb-preremove.sh
      postremove: packaging/deb-postremove.sh
  rpm:
    scripts:
      preremove: packaging/rpm-preremove.sh
      postremove: packaging/rpm-postremove.sh
rpm:
  requires:
    post:
      - systemd
