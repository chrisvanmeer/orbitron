name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  build:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Orbitron binary
        run: make build

      - name: Run tests
        run: go test ./...

      - name: Upload Orbitron Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitron-linux-arm64
          path: bin/orbitron
          retention-days: 7

  ansible-collection:
    name: Ansible Collection (sanity + units)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/chrisvanmeer/orbitron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Sanity tests
        run: ansible-test sanity --venv --requirements
      - name: Unit tests
        run: ansible-test units --venv --requirements
