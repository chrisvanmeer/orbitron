name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  build:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Orbitron binary
        run: make build

      - name: Run tests
        run: go test ./...

      - name: Upload Orbitron Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitron-linux-arm64
          path: bin/orbitron
          retention-days: 7

  ansible-collection:
    name: Ansible Collection (sanity + units)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/chrisvanmeer/orbitron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Sanity tests
        run: ansible-test sanity --venv --requirements
      - name: Unit tests
        run: ansible-test units --venv --requirements

  integration-mirror:
    name: Integration (orbitron_mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Run the orbitron_mirror role against a scratch daemon
        env:
          ORBITRON_TEST_PORT: 18080
        run: |
          set -euo pipefail

          SCRATCH="$(mktemp -d)"
          mkdir -p "$SCRATCH/storage"
          trap 'rm -rf "$SCRATCH"' EXIT

          go build -o "$SCRATCH/orbitron" .

          cat > "$SCRATCH/config.yml" <<YAML
          listen_addr: "127.0.0.1:${ORBITRON_TEST_PORT}"
          storage_path: "${SCRATCH}/storage"
          log_path: "${SCRATCH}/orbitron.log"
          tokens_file: "${SCRATCH}/tokens.json"
          require_auth_pull: false
          max_concurrency: 2
          token_ttl_days: 0
          YAML

          "$SCRATCH/orbitron" --config "$SCRATCH/config.yml" &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true; rm -rf "$SCRATCH"' EXIT

          curl_health() { curl -fsS "http://127.0.0.1:${ORBITRON_TEST_PORT}/healthz" >/dev/null; }
          ready=false
          for _ in $(seq 1 30); do
            if curl_health 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"

          export ORBITRON_TEST_TOKEN
          ORBITRON_TEST_TOKEN="$("$SCRATCH/orbitron" --config "$SCRATCH/config.yml" --generate-token -q)"

          ansible-galaxy collection build ansible_collections/chrisvanmeer/orbitron --output-path "$SCRATCH" >/dev/null
          ansible-galaxy collection install "$SCRATCH"/chrisvanmeer-orbitron-*.tar.gz --force >/dev/null

          cat > "$SCRATCH/mirror_test.yml" <<YAML
          ---
          - name: Mirror requirements against the scratch daemon
            hosts: localhost
            connection: local
            roles:
              - role: chrisvanmeer.orbitron.orbitron_mirror
                vars:
                  orbitron_mirror_url: http://127.0.0.1:${ORBITRON_TEST_PORT}
                  orbitron_mirror_token: "{{ lookup('env', 'ORBITRON_TEST_TOKEN') }}"
                  orbitron_mirror_collections:
                    - name: community.general
                      version: "8.5.0"
          YAML

          check_sync_result() {
            logfile="$1"; expected="$2"; label="$3"
            sync_line="$(awk '/Sync the mirror/ {found=1; next} found && /^(ok|changed|skipping):/ {print; exit}' "$logfile")"
            case "$sync_line" in
              "$expected":*) ;;
              *)
                echo "sync task on $label expected $expected but was: $sync_line"
                cat "$logfile"
                exit 1
                ;;
            esac
          }

          wait_for_version() {
            # Returns true once a collection at name==version is stored on the
            # mirror, polling the storage API up to ${3} seconds. Declaring a
            # new version triggers a background sync in the daemon; that may
            # finish before the orbitron_sync module reads the inventory, so
            # the sync task can legitimately report 'ok'. What matters is that
            # the version actually lands on the mirror.
            name="$1"; version="$2"; timeout="${3:-120}"
            for _ in $(seq 1 "$timeout"); do
              body="$(curl -fsS -H "Authorization: Bearer $ORBITRON_TEST_TOKEN" \
                "http://127.0.0.1:${ORBITRON_TEST_PORT}/api/v1/storage" || true)"
              if python3 -c '
          import json, sys
          name, version = sys.argv[1], sys.argv[2]
          d = json.loads(sys.argv[3])
          for e in d.get("collections", []):
              if e.get("name") == name and any(
                  v.get("version") == version for v in e.get("versions", [])
              ):
                  raise SystemExit(0)
          raise SystemExit(1)
          ' "$name" "$version" "$body"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          # Run 1: first ingest must trigger a sync (changed).
          ansible-playbook "$SCRATCH/mirror_test.yml" > "$SCRATCH/run1.log" 2>&1
          check_sync_result "$SCRATCH/run1.log" changed "run 1 (fresh content)"

          # Run 2: an unchanged, fully mirrored playbook must be idempotent:
          # the sync task reports ok and queues no new sync.
          ansible-playbook "$SCRATCH/mirror_test.yml" > "$SCRATCH/run2.log" 2>&1
          check_sync_result "$SCRATCH/run2.log" ok "run 2 (unchanged, complete)"

          # Run 3: declaring a new version must mirror it. The sync task may
          # report 'ok' when the manifest-triggered background sync already
          # stored the new version before the module read the inventory (timing
          # race), so accept changed|ok and fail only when the version never
          # actually lands on the mirror.
          sed 's/"8.5.0"/"8.6.0"/' "$SCRATCH/mirror_test.yml" > "$SCRATCH/mirror_test_bump.yml"
          ansible-playbook "$SCRATCH/mirror_test_bump.yml" > "$SCRATCH/run3.log" 2>&1
          if wait_for_version community.general 8.6.0 120; then
            sync_line="$(awk '/Sync the mirror/ {found=1; next} found && /^(ok|changed|skipping):/ {print; exit}' "$SCRATCH/run3.log")"
            case "$sync_line" in
              changed:*|ok:*)
                echo "run 3 (version bumped): sync reported ${sync_line%: *}, community.general 8.6.0 mirrored"
                ;;
              *)
                echo "run 3: mirror holds community.general 8.6.0 but sync task reported: $sync_line"
                cat "$SCRATCH/run3.log"
                exit 1
                ;;
            esac
          else
            echo "run 3: community.general 8.6.0 was never mirrored (sync may have failed)"
            cat "$SCRATCH/run3.log"
            exit 1
          fi

          # Run 4: reverting to an already mirrored version is idempotent.
          # The mirror already holds the exact pinned version (it was fetched
          # on run 1), so the sync task has no work and reports ok.
          ansible-playbook "$SCRATCH/mirror_test.yml" > "$SCRATCH/run4.log" 2>&1
          check_sync_result "$SCRATCH/run4.log" ok "run 4 (manifest reverted)"

          # Run 5: back to an unchanged, fully mirrored playbook: ok again.
          ansible-playbook "$SCRATCH/mirror_test.yml" > "$SCRATCH/run5.log" 2>&1
          check_sync_result "$SCRATCH/run5.log" ok "run 5 (idempotent again)"

          # Run 6: version 'all' mirrors every published version of a small
          # collection. The artifact count must be stable across a rerun: the
          # rerun re-checks the indexes but must not re-download anything.
          cat > "$SCRATCH/mirror_all.yml" <<YAML
          ---
          - name: Mirror every published version
            hosts: localhost
            connection: local
            roles:
              - role: chrisvanmeer.orbitron.orbitron_mirror
                vars:
                  orbitron_mirror_url: http://127.0.0.1:${ORBITRON_TEST_PORT}
                  orbitron_mirror_token: "{{ lookup('env', 'ORBITRON_TEST_TOKEN') }}"
                  orbitron_mirror_collections:
                    - name: gluster.gluster
                      version: all
          YAML

          count_gluster() {
            body="$(curl -fsS -H "Authorization: Bearer $ORBITRON_TEST_TOKEN" \
              "http://127.0.0.1:${ORBITRON_TEST_PORT}/api/v1/storage")"
            python3 -c 'import json, sys; d = json.loads(sys.argv[1]); print(sum(len(i["versions"]) for i in d["collections"] if i["name"] == "gluster.gluster"))' "$body"
          }

          ansible-playbook "$SCRATCH/mirror_all.yml" > "$SCRATCH/run6.log" 2>&1
          check_sync_result "$SCRATCH/run6.log" changed "run 6 (mirror all)"
          before="$(count_gluster)"
          if [ "$before" -eq 0 ]; then
            echo "no gluster.gluster versions mirrored for version 'all'"
            cat "$SCRATCH/run6.log"
            exit 1
          fi

          ansible-playbook "$SCRATCH/mirror_all.yml" > "$SCRATCH/run7.log" 2>&1
          check_sync_result "$SCRATCH/run7.log" ok "run 7 (mirror all rerun)"
          after="$(count_gluster)"
          if [ "$before" != "$after" ]; then
            echo "rerun re-downloaded content: gluster.gluster versions before=$before after=$after"
            exit 1
          fi
          echo "no re-download on rerun (gluster.gluster artifacts: $after)"
